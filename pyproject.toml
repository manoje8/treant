[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "treant"
version = "0.1.2"
description = "A simple document parser"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4",
    "docling",
    "trafilatura",
    "pypdf",
    "google-cloud-documentai",
    "python-dotenv",
    "ruff",
    "pre-commit",
    "ipykernel>=7.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]

[project.scripts]
treant = "main:cli"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
]
ignore = [
    "E402",
    "E501",
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests (may require external services)",
    "eval: marks tests as evaluation tests",
]
addopts = "-v --tb=short --strict-markers"
asyncio_mode = "auto"
